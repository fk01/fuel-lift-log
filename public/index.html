<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0e0e0d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Fuel & Lift">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/apple-touch-icon.png?v=3">
<title>Fuel &amp; Lift Log</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&family=Noto+Serif+Thai:wght@400;500&display=swap">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}*{-webkit-tap-highlight-color:transparent}body{margin:0;font-size:14px;font-family:system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<link rel="stylesheet" href="/css/app.css">
</head><body>

<div class="wrap">
  <header>
    <div style="display:flex;justify-content:space-between;gap:12px;align-items:start"><h1 id="h1"></h1><span style="display:flex;gap:6px"><button class="btn sm" id="reload-btn" aria-label="Refresh" onclick="doRefresh()">↻</button><button class="btn sm" id="lang" aria-label="Language">TH</button></span></div>
  </header>
  <div class="tabs" role="tablist">
    <button class="tab" role="tab" id="tab-food" data-v="food" data-i="อาหาร" data-pre="🍽️ ">🍽️ อาหาร</button>
    <button class="tab" role="tab" id="tab-gym" data-v="gym" data-i="เวท" data-pre="🏋️ ">🏋️ เวท</button>
  </div>
  <section class="stepbox" id="step1"><div class="step"><span class="num" id="sn-1">1</span><span class="step-t" data-i="เลือกวัน">เลือกวัน</span><span style="margin-left:auto;display:flex;gap:6px"><button class="btn sm" id="fold-btn" aria-label="Show or hide calendar">📅 ▾</button><button class="btn sm" id="today-btn" hidden data-i="วันนี้">วันนี้</button><button class="btn sm primary" id="share-last" data-i="แชร์" data-pre="↗ ">↗ แชร์</button></span></div>
    <input type="hidden" id="day"><div class="date" id="date" style="margin:0"></div>
    <div class="fold">
      <div class="stats" id="stats"></div>
      <div class="cal">
        <div class="cal-head"><button class="btn sm" id="cal-prev" aria-label="Previous month">‹</button><b id="cal-title"></b><button class="btn sm" id="cal-next" aria-label="Next month">›</button></div>
        <div class="cal-grid" id="cal-grid"></div>
      </div>
    </div>
  </section>

  <!-- FOOD -->
  <div id="v-food" class="stack" style="gap:18px">
    <section class="totals" aria-label="Totals">
      <div class="bar"><div class="bar-top"><span data-i="แคลอรี">แคลอรี</span><b id="kcal-t"></b></div><div class="track"><div class="fill" id="kcal-f"></div></div></div>
      <div class="bar"><div class="bar-top"><span data-i="โปรตีน">โปรตีน</span><b id="p-t"></b></div><div class="track"><div class="fill" id="p-f"></div></div></div>
      <p class="note" id="status"></p>
    </section>
    <section>
      <div class="step" style="margin-bottom:8px"><span class="num">2</span><span class="step-t" data-i="เลือกประเภทวัน">เลือกประเภทวัน</span></div>
      <div class="chips">
        <button class="chip" id="t-run" data-k="run" aria-pressed="false" data-i="วิ่ง" data-pre="🏃 ">🏃 วิ่ง</button>
        <button class="chip" id="t-bad" data-k="bad" aria-pressed="false" data-i="ตีแบด" data-pre="🏸 ">🏸 ตีแบด</button>
        <button class="chip" id="t-late" data-k="late" aria-pressed="false" data-i="เวทค่ำ" data-pre="🏋️ ">🏋️ เวทค่ำ</button>
      </div>
    </section>
    <div class="step"><span class="num">3</span><span class="step-t" data-i="ติ๊กมื้อที่กินแล้ว">ติ๊กมื้อที่กินแล้ว</span></div>
    <section class="stack" id="meals"></section>
    <section>
      <div class="label" data-i="โปรตีน 7 วัน">โปรตีน 7 วัน</div>
      <div class="hist" id="hist"></div>
    </section>
    <button class="btn ghost" id="reset" style="align-self:start" data-i="ล้างวันนี้">ล้างวันนี้</button>
    <section>
      <div class="label" data-i="ประวัติ">ประวัติ</div>
      <div class="stack" id="food-hist"></div>
    </section>
  </div>

  <!-- GYM -->
  <div id="v-gym" class="stack" style="gap:16px" hidden>
    <section class="hero" id="hero"><canvas id="hero-cv" width="64" height="64" style="width:80px;height:80px"></canvas><div class="hero-i"><div class="hero-l"><b id="hero-lv">Lv 1</b><span id="hero-tier"></span></div><div class="track"><div class="fill" id="hero-fill"></div></div><div class="hero-l"><span id="hero-xp"></span><span id="hero-next"></span></div></div></section>
    <section class="stepbox">
      <div class="step"><span class="num" id="sn-2">2</span><span class="step-t" data-i="เลือกโปรแกรม">เลือกโปรแกรม</span><button class="btn sm" id="lib-open" style="margin-left:auto" data-i="คลังท่า" data-pre="📚 ">📚 คลังท่า</button></div>
      <div class="prog-pick" id="progs"></div>
    </section>
    <section class="stepbox" id="step3">
      <div class="step"><span class="num" id="sn-3">3</span><span class="step-t" data-i="กรอกน้ำหนัก">กรอกน้ำหนัก</span><button class="btn sm" id="edit-mode" style="margin-left:auto">แก้ไขท่า</button><button class="btn sm ghost" id="cancel-prog" aria-label="Cancel">✕</button></div>
      <p class="note" id="pick-hint" data-i="เลือกโปรแกรมด้านบนก่อน">เลือกโปรแกรมด้านบนก่อน</p>
      <div class="stack" id="exs"></div>
    </section>
    <section class="stepbox" id="step4">
      <div class="step"><span class="num" id="sn-4">4</span><span class="step-t" data-i="บันทึก">บันทึก</span></div>
      <div class="actions">
      <button class="btn primary" id="save-w" data-i="บันทึก">บันทึก</button>
      <span class="note" id="save-day" style="align-self:center;font-family:var(--f-num)"></span>
      <button class="btn ghost" id="clear-w" data-i="ล้าง">ล้าง</button>
      </div>
    </section>
    <section id="hist-sec" class="stack">
      <div class="row-head" style="align-items:center"><div class="label" style="margin:0" data-i="ประวัติ">ประวัติ</div>
        <div class="chips" id="hist-mode"><button class="chip" data-m="chart" data-i="กราฟ" data-pre="📈 ">📈 กราฟ</button><button class="chip" data-m="list" data-i="รายการ" data-pre="☰ ">☰ รายการ</button></div></div>
      <div class="stack" id="hist-chart" hidden></div>
      <div class="stack" id="sessions"></div>
    </section>
  </div>

  <section class="rules" style="display:grid;gap:8px">
    <div class="label" style="margin:0" data-i="ข้อมูล">ข้อมูล</div>
    <p class="note" id="sync"></p>
    <div class="actions"><button class="btn sm" id="export">Export JSON</button><button class="btn sm" id="import" data-i="นำเข้า JSON">นำเข้า JSON</button><input type="file" id="import-file" accept="application/json,.json" hidden></div>
    <div class="label" style="margin:8px 0 0">Face ID</div>
    <p class="note" id="pk-state"></p>
    <div class="actions"><button class="btn sm primary" id="pk-add" data-i="ตั้งค่า Face ID">ตั้งค่า Face ID</button></div>
    <div class="label" style="margin:8px 0 0" data-i="แจ้งเตือน">แจ้งเตือน</div>
    <p class="note" id="push-state"></p>
    <div class="actions"><button class="btn sm primary" id="push-on" data-i="เปิดแจ้งเตือน">เปิดแจ้งเตือน</button><button class="btn sm" id="push-test" hidden data-i="ส่งทดสอบ">ส่งทดสอบ</button></div>
    <textarea id="export-box" hidden readonly rows="6" style="width:100%;box-sizing:border-box;background:var(--bg);color:var(--fg);border:1px solid var(--line);border-radius:4px;font-family:var(--f-num);font-size:.75rem"></textarea>
  </section>
</div>
<div class="toast" id="toast" hidden></div>
<div id="ptr" aria-hidden="true"><span id="ptr-i">↓</span></div>
<div class="modal" id="login" hidden role="dialog" aria-modal="true" aria-label="Login">
  <form class="modal-in" id="login-form" style="max-width:320px">
    <h1 style="margin:0">Fuel &amp; Lift</h1>
    <label class="label" for="pin" style="margin:0">PIN</label>
    <input id="pin" type="password" inputmode="numeric" autocomplete="current-password" required style="background:var(--surface);color:var(--fg);border:1px solid var(--line);border-radius:6px;padding:12px;font-family:var(--f-num);font-size:1.2rem;letter-spacing:.3em;text-align:center">
    <p class="note" id="login-err" hidden style="color:var(--warn)">Wrong PIN</p>
    <button class="btn primary" type="submit">Unlock</button>
    <button class="btn" type="button" id="passkey-login" hidden>🙂 Face ID</button>
  </form>
</div>
<div class="modal pad" id="pad" hidden role="dialog" aria-modal="true" aria-label="Number picker">
  <div class="pad-in">
    <div class="pad-top"><small id="pad-t"></small><b id="pad-v">–</b></div>
    <div class="pad-g" id="pad-chips"></div>
    <div class="pad-g" id="pad-steps"></div>
    <div class="actions"><button class="btn ghost" id="pad-clear" data-i="ล้าง">ล้าง</button><button class="btn primary" id="pad-done" style="flex:1" data-i="เสร็จ">เสร็จ</button></div>
  </div>
</div>
<div class="modal" id="lib-modal" hidden role="dialog" aria-modal="true" aria-label="Exercise library">
  <div class="modal-in" style="align-self:start">
    <div class="row-head" style="align-items:center"><div class="label" style="margin:0" id="lib-title">คลังท่า</div><button class="btn sm" id="lib-close" data-i="ปิด">ปิด</button></div>
    <button class="btn primary" id="lib-new" data-i="สร้างท่าใหม่" data-pre="+ ">+ สร้างท่าใหม่</button>
    <div class="chips" id="lib-groups"></div>
    <div class="stack" id="lib-list"></div>
  </div>
</div>
<div class="modal" id="run-modal" hidden role="dialog" aria-modal="true" aria-label="Run">
  <div class="modal-in run-in">
    <div class="label" style="margin:0">🏃 <span data-i="บันทึกการวิ่ง">บันทึกการวิ่ง</span></div>
    <div class="run-f"><label><span data-i="ระยะ (km)">ระยะ (km)</span><input id="run-km" type="text" readonly inputmode="none" data-pad="km" placeholder="10.00"></label>
    <label><span data-i="เวลา (ชม:นาที:วิ)">เวลา (ชม:นาที:วิ)</span><input id="run-time" type="text" readonly inputmode="none" data-pad="time" placeholder="58:30"></label></div>
    <label class="btn sm" style="justify-self:start;cursor:pointer">📷 <span data-i="เลือกรูปพื้นหลัง">เลือกรูปพื้นหลัง</span><input id="run-photo" type="file" accept="image/*" hidden></label><small id="run-photo-n" style="color:var(--muted);margin-top:-8px"></small>
    <div class="run-pace"><small>Pace</small><b id="run-pace">– /km</b></div>
    <div class="actions"><button class="btn primary" id="run-save" data-i="เซฟ">เซฟ</button><button class="btn" id="run-share" style="background:#fc5200;border:0;color:#fff" data-i="แชร์การ์ด">แชร์การ์ด</button><button class="btn" id="run-overlay" data-i="แบบพื้นใส">แบบพื้นใส</button></div>
    <div class="actions"><button class="btn ghost sm" id="run-del" data-i="ลบ">ลบ</button><button class="btn sm" id="run-close" data-i="ปิด">ปิด</button></div>
  </div>
</div>
<div class="modal" id="share-modal" hidden role="dialog" aria-modal="true" aria-label="Share">
  <div class="modal-in">
    <img id="share-img" alt="Workout summary card">
    <div class="actions" style="justify-content:center"><button class="btn" id="share-story" style="background:linear-gradient(45deg,#f9a03f,#e1306c,#833ab4);border:0;color:#fff">IG Story 9:16</button><button class="btn primary" id="share-save" data-i="บันทึกรูป">บันทึกรูป</button><button class="btn" id="share-close" data-i="ปิด">ปิด</button></div>
    <p class="note" id="share-hint" style="text-align:center" hidden></p>
    <a id="open-ig" hidden href="instagram://story-camera" class="btn" style="justify-self:center;text-decoration:none;background:linear-gradient(45deg,#f9a03f,#e1306c,#833ab4);border:0;color:#fff">เปิด Instagram →</a>
    <a id="open-ig-web" hidden href="https://www.instagram.com/" target="_blank" rel="noopener" class="note" style="justify-self:center;color:var(--muted)">instagram.com</a>
  </div>
</div>
<div class="rest" id="rest" hidden role="timer" aria-live="polite">
  <div class="rest-in">
    <div class="rest-top"><div><div class="label" style="margin:0" data-i="พัก">พัก</div><div class="rest-time" id="rest-time">1:30</div></div><canvas id="rest-cv" width="64" height="64" style="width:64px;height:64px"></canvas><div class="rest-next" id="rest-next"></div></div>
    <div class="track"><div class="fill" id="rest-fill"></div></div>
    <div class="actions"><button class="btn sm" id="rest-minus">−15s</button><button class="btn sm" id="rest-plus">+15s</button><button class="btn sm primary" id="rest-skip" data-i="พร้อม">พร้อม</button></div>
  </div>
</div>

<script src="/js/core.js"></script>
<script src="/js/food.js"></script>
<script src="/js/programs.js"></script>
<script src="/js/run.js"></script>
<script src="/js/workout.js"></script>
<script src="/js/exercise-edit.js"></script>
<script src="/js/exercise-library.js"></script>
<script src="/js/hero.js"></script>
<script src="/js/rest-timer.js"></script>
<script src="/js/auth.js"></script>
<script src="/js/push.js"></script>
<script src="/js/data-io.js"></script>
<script src="/js/sync.js"></script>
<script src="/js/muscle-map.js"></script>
<script src="/js/progress.js"></script>
<script src="/js/history-chart.js"></script>
<script src="/js/share-card.js"></script>
<script src="/js/number-pad.js"></script>
<script src="/js/refresh.js"></script>
<script src="/js/app.js"></script>

</body></html>
