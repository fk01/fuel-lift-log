<!doctype html>
<html lang="th"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0a0b0d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="WeightGram">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/apple-touch-icon.png?v=138712">
<title>WeightGram</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&family=Share+Tech+Mono&display=swap">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}*{-webkit-tap-highlight-color:transparent}body{margin:0;font-size:var(--t-sm);font-family:system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<link rel="stylesheet" href="/css/app.css?v=2818">
<link rel="stylesheet" href="/css/fix-eat-comic.css?v=1">
</head><body>

<div class="wrap">
  <header>
    <div style="display:flex;justify-content:space-between;gap:12px;align-items:center"><span style="display:flex;gap:10px;align-items:center;min-width:0"><h1 id="h1"></h1></span></div>
  </header>
  <section class="stepbox" id="step1"><div class="step"><span class="num" id="sn-1" hidden>1</span><div class="date" id="date"></div><span style="margin-left:auto;display:flex;gap:6px;flex-wrap:wrap;min-width:0"><button class="btn sm" id="fold-btn" aria-label="Show or hide calendar">📅 ▾</button><button class="btn sm" id="today-btn" hidden data-i="วันนี้">วันนี้</button><button class="btn sm ghost" id="share-last" data-i="แชร์" data-pre="↗ ">↗ แชร์</button></span></div>
    <input type="hidden" id="day">
    <div class="week" id="week"></div>
      <div class="cal" id="hdr-cal" hidden>
        <div class="cal-head"><button class="btn sm" id="cal-prev" aria-label="Previous month">‹</button><b id="cal-title"></b><button class="btn sm" id="cal-next" aria-label="Next month">›</button></div>
        <div class="cal-grid" id="cal-grid"></div>
      </div>

  </section>

  <!-- HOME: the three questions -->
  <div id="v-home" class="stack" style="gap:20px" hidden></div>

  <!-- EXPLORE: community -->
  <div id="v-explore" class="stack" style="gap:20px" hidden></div>

  <!-- FOOD -->
  <div id="v-food" class="stack" style="gap:20px">
    <section class="eat-cal" id="eat-cal"></section>
    <section class="totals" aria-label="Totals">
      <button class="day-gear" id="day-gear" aria-label="ประเภทวัน" aria-expanded="false">⚙</button>
      <div id="food-ring"></div>
      <div class="bar"><div class="bar-top"><span data-i="แคลอรี">แคลอรี</span><b id="kcal-t"></b></div><div class="track"><div class="fill" id="kcal-f"></div></div></div>
      <div class="bar"><div class="bar-top"><span data-i="โปรตีน">โปรตีน</span><b id="p-t"></b></div><div class="track"><div class="fill" id="p-f"></div></div></div>
      <p class="note" id="status"></p>
    </section>
    
    <section id="day-type" hidden>
      <div class="step" style="margin-bottom:8px"><span class="num">2</span><span class="step-t" data-i="เลือกประเภทวัน">เลือกประเภทวัน</span></div>
      <div class="chips">
        <button class="chip" id="t-run" data-k="run" aria-pressed="false" data-i="วิ่ง" data-pre="🏃 ">🏃 วิ่ง</button>
        <button class="chip" id="t-bad" data-k="bad" aria-pressed="false" data-i="ตีแบด" data-pre="🏸 ">🏸 ตีแบด</button>
        <button class="chip" id="t-late" data-k="late" aria-pressed="false" data-i="เวทค่ำ" data-pre="🏋️ ">🏋️ เวทค่ำ</button>
      </div>
    </section>

    <div class="mp-open-row"><span class="mp-cur" id="mp-cur"></span><button class="btn sm" id="mp-open">✎ <span data-i="จัดการแผน">จัดการแผน</span></button></div>
    <section class="stack" id="meals"></section>
    <button class="btn" id="food-add"><span data-i="บันทึกอาหาร">บันทึกอาหาร</span></button>
    <button class="btn ghost" id="reset" style="align-self:start" data-i="ล้างวันนี้">ล้างวันนี้</button>
  </div>

  <!-- RESTORE_MARKER: full body continues in next commit if truncated -->
  <p id="restore-needed">If you see this, index restore was truncated.</p>
</div>
</body></html>
