<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0e0e0d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Fuel & Lift">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/apple-touch-icon.png?v=3">
<title>Fuel &amp; Lift Log</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&family=Noto+Serif+Thai:wght@400;500&display=swap">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}*{-webkit-tap-highlight-color:transparent}body{margin:0;font-size:14px;font-family:system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<style>
/* Layout: one narrow column on near-black with a faint dot grid; serif headings, mono uppercase labels, cream pills. Single dark look by choice. */
:root{
  --bg:#0e0e0d; --surface:#151514; --fg:#ece8e1; --muted:#8a8780; --line:#2a2927;
  --accent:#ece8e1; --accent-soft:#1f1e1c; --warn:#d9a46c; --up:#c9e6c2; --on-accent:#111110;
  --f-body:"IBM Plex Sans Thai",system-ui,sans-serif; --f-num:"IBM Plex Mono",ui-monospace,monospace;
  --f-display:"Noto Serif Thai",Georgia,serif;
  color-scheme:dark;
}
body{background:var(--bg) radial-gradient(circle,#ffffff10 1px,transparent 1.2px) 0 0/16px 16px;color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 48px;display:flex;flex-direction:column;gap:18px}
h1{font-family:var(--f-display);font-weight:400;font-size:2rem;line-height:1.15;letter-spacing:-.01em;margin:0;text-wrap:balance}
h2{font-size:1.05rem;margin:0}
.date{color:var(--muted);font-family:var(--f-num);font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;margin-top:6px}
.tabs{display:flex;gap:8px}
.tab{border:1px solid var(--line);background:none;color:var(--fg);font-family:var(--f-num);font-size:.75rem;letter-spacing:.08em;text-transform:uppercase;padding:8px 16px;border-radius:999px;cursor:pointer}
.tab[aria-selected="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.totals{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:10px;display:grid;gap:10px;border-bottom:1px solid var(--line)}
.bar{display:grid;gap:4px}
.bar-top{display:flex;justify-content:space-between;font-size:.85rem}
.bar-top b{font-family:var(--f-num);font-variant-numeric:tabular-nums}
.track{height:4px;border-radius:2px;background:var(--line);overflow:hidden}
.fill{height:100%;background:var(--accent);transition:width .3s}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:none;color:var(--fg);border-radius:999px;padding:6px 14px;font:inherit;font-size:.85rem;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-weight:500}
.label{font-family:var(--f-num);font-size:.7rem;letter-spacing:.1em;color:var(--muted);text-transform:uppercase;margin-bottom:8px}
.label::before{content:"● ";font-size:.6rem}
.stack{display:flex;flex-direction:column;gap:10px}
.meal{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:start;background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:12px 14px;cursor:pointer}
.meal.done{border-color:#4a4844;background:var(--accent-soft);opacity:.72}
.meal input{width:22px;height:22px;margin-top:3px;accent-color:var(--accent)}
.day{border-radius:4px}
.row-head{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.time{font-family:var(--f-num);font-weight:500}
.macro{font-family:var(--f-num);font-size:.8rem;color:var(--muted);font-variant-numeric:tabular-nums}
.meal ul{margin:4px 0 0;padding-left:18px;color:var(--muted);font-size:.9rem}
.extra .time{color:var(--accent)}
.note{font-size:.85rem;color:var(--muted);margin:0}
.hist{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;text-align:center}
.day{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:6px 2px;font-size:.75rem}
.day b{display:block;font-family:var(--f-num);font-size:.8rem}
.day.hit{border-color:var(--up);color:var(--up)}
.btn{border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:8px;padding:8px 14px;font:inherit;font-size:.9rem;cursor:pointer}
.btn{border-radius:999px;font-family:var(--f-num);font-size:.75rem;letter-spacing:.08em;text-transform:uppercase}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-weight:500}
.btn.ghost{background:none;color:var(--muted)}
.btn.sm{padding:4px 10px;font-size:.8rem}
.ex{background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:12px 14px;display:grid;gap:8px}
.ex-name{font-weight:500}
.zone{font-size:.8rem;color:var(--muted)}
.last{font-size:.8rem;color:var(--muted);font-family:var(--f-num);font-variant-numeric:tabular-nums}
.last .up{color:var(--up)}
.sets{display:grid;grid-template-columns:2.2em 1fr 1fr 2.4em;gap:6px;align-items:center}
.sets .h{font-size:.72rem;color:var(--muted);text-align:center}
.sets .n{font-family:var(--f-num);font-size:.8rem;color:var(--muted);text-align:center}
.sets input[type=number]{width:100%;min-width:0;box-sizing:border-box;border:1px solid var(--line);background:var(--bg);color:var(--fg);border-radius:6px;padding:7px 6px;font-family:var(--f-num);font-size:.95rem;text-align:center}
.sets input[type=checkbox]{width:22px;height:22px;justify-self:center;accent-color:var(--accent)}
.sets .warm{font-size:.7rem;color:var(--warn);text-align:center}
.prog-pick{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.prog{border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:4px;padding:12px 6px;font:inherit;cursor:pointer;display:grid;gap:2px;text-align:center}
.prog b{font-family:var(--f-display);font-weight:400;font-size:1.15rem}
.prog small{color:var(--muted);font-size:.72rem}
.prog[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.prog .next{color:var(--up)}
.prog .next{color:var(--accent);font-weight:500}
.rules{background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:10px 14px;font-size:.85rem;color:var(--muted)}
.rules ol{margin:4px 0 0;padding-left:20px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:8px 16px;border-radius:8px;font-size:.9rem;z-index:20}
details.log summary{cursor:pointer;font-size:.85rem;color:var(--accent)}
.log table{width:100%;border-collapse:collapse;font-size:.8rem;font-family:var(--f-num);margin-top:6px}
.log td{padding:3px 4px;border-top:1px solid var(--line);vertical-align:top}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.rest{position:fixed;left:0;right:0;bottom:0;z-index:15;background:#0e0e0dee;border-top:1px solid var(--line);backdrop-filter:blur(6px);padding:12px max(16px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.rest-in{max-width:560px;margin:0 auto;display:grid;gap:8px}
.rest-top{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.rest-time{font-family:var(--f-num);font-size:2.4rem;line-height:1;font-variant-numeric:tabular-nums}
.rest-time.done{color:var(--up)}
.rest-next{font-size:.85rem;color:var(--muted);text-align:right;min-width:0}
.rest-next b{color:var(--fg);font-weight:500}
.rest .track{height:3px}
.wrap.has-rest{padding-bottom:150px}
.hero{display:flex;align-items:center;gap:14px;padding:12px 14px;border:1px solid var(--line);border-radius:14px;background:var(--accent-soft)}
.hero canvas,.rest canvas{image-rendering:pixelated;flex:none}
.hero-i{flex:1;min-width:0;display:grid;gap:6px}
.hero-l{display:flex;justify-content:space-between;align-items:baseline;font-family:var(--f-num)}
.hero-l b{font-size:1.3rem}.hero-l span{font-size:.75rem;color:var(--muted)}
.hero .track{height:6px}.hero .fill{background:var(--up)}
.rest-top canvas{margin-right:auto;margin-left:12px}
@keyframes lvl{0%,100%{transform:scale(1)}50%{transform:scale(1.25)}}.hero.lv canvas{animation:lvl .5s 3}
.restset{display:flex;align-items:center;gap:6px;font-family:var(--f-num);font-size:.75rem;color:var(--muted);letter-spacing:.04em}
.restset b{color:var(--fg);font-weight:500;min-width:3.2em;text-align:center;font-variant-numeric:tabular-nums}
.restset button{width:28px;height:28px;border:1px solid var(--line);background:none;color:var(--fg);border-radius:999px;font:inherit;cursor:pointer;line-height:1}
.stepbox{display:grid;gap:12px;padding-top:4px}
.step{display:flex;align-items:center;gap:10px}
.step .num{width:24px;height:24px;border-radius:50%;border:1px solid var(--accent);display:grid;place-items:center;font-family:var(--f-num);font-size:.75rem;flex:none}
.step .num.done{background:var(--accent);color:var(--on-accent)}
.step-t{font-family:var(--f-display);font-size:1.1rem}
.stepbox.locked{opacity:.4;pointer-events:none}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:10px;display:grid;gap:2px}
.stat b{font-family:var(--f-display);font-weight:400;font-size:1.6rem;line-height:1.1;font-variant-numeric:tabular-nums}
.stat span{font-family:var(--f-num);font-size:.65rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.cal{background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:12px;display:grid;gap:10px}
.cal-head{display:flex;align-items:center;justify-content:space-between}
.cal-head b{font-family:var(--f-display);font-weight:400;font-size:1.05rem}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center;font-family:var(--f-num);font-size:.8rem}
.cal-grid .dow{color:var(--muted);font-size:.65rem}
.cal-grid .d{aspect-ratio:1;max-width:100%;display:grid;place-items:center;border-radius:50%;color:var(--muted)}
.cal-grid .d.in{color:var(--fg)}
.cal-grid .d.on{background:var(--accent);color:var(--on-accent);font-weight:500}
.cal-grid button.d{border:0;background:none;font:inherit;cursor:pointer;padding:0;width:100%}
.cal-grid .d.sel{outline:2px dashed var(--up);outline-offset:2px;color:var(--up);font-weight:700}
.cal-grid .d.sel.on{color:var(--on-accent)}
.cal-grid .d:disabled{opacity:.3;cursor:default}
#step1.compact .fold,#step1.folded .fold{display:none}
.fold{display:grid;gap:8px}
.cal-grid .d.today{outline:1px solid var(--accent)}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}
.badge{border:1px solid var(--line);border-radius:4px;padding:10px 6px;text-align:center;display:grid;gap:4px;background:var(--surface)}
.badge i{font-style:normal;font-size:1.6rem}
.badge small{font-size:.72rem;color:var(--muted);line-height:1.3}
.badge.lock{opacity:.35;filter:grayscale(1)}
.badge.got{border-color:var(--up)}
.modal{position:fixed;inset:0;z-index:30;background:#000;display:grid;place-items:center;padding:calc(16px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));overflow:auto}
.modal-in{max-width:420px;width:100%;display:grid;gap:12px}
.modal-in img{width:auto;max-width:100%;max-height:calc(100dvh - 190px);justify-self:center;object-fit:contain;border-radius:8px;border:1px solid var(--line)}
#ptr{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 8px);z-index:25;width:40px;height:40px;margin-left:-20px;border-radius:50%;background:var(--surface);border:1px solid var(--line);display:grid;place-items:center;color:var(--fg);font-family:var(--f-num);transform:translateY(-80px);opacity:0;transition:transform .2s,opacity .2s;pointer-events:none}
#ptr.on{transition:none}
#ptr.ready{background:var(--accent);color:var(--on-accent)}
#ptr.spin #ptr-i{animation:ptrspin .8s linear infinite}
@keyframes ptrspin{to{transform:rotate(360deg)}}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (prefers-reduced-motion:reduce){.fill{transition:none}}
</style>
</head><body>

<div class="wrap">
  <header>
    <div style="display:flex;justify-content:space-between;gap:12px;align-items:start"><h1 id="h1"></h1><span style="display:flex;gap:6px"><button class="btn sm" id="reload-btn" aria-label="Refresh" onclick="doRefresh()">↻</button><button class="btn sm" id="lang" aria-label="Language">TH</button></span></div>
  </header>
  <div class="tabs" role="tablist">
    <button class="tab" role="tab" id="tab-food" data-v="food" data-i="อาหาร" data-pre="🍽️ ">🍽️ อาหาร</button>
    <button class="tab" role="tab" id="tab-gym" data-v="gym" data-i="เวท" data-pre="🏋️ ">🏋️ เวท</button>
  </div>
  <section class="stepbox" id="step1"><div class="step"><span class="num" id="sn-1">1</span><span class="step-t" data-i="เลือกวัน">เลือกวัน</span><span style="margin-left:auto;display:flex;gap:6px"><button class="btn sm" id="fold-btn" aria-label="Show or hide calendar">📅 ▾</button><button class="btn sm" id="today-btn" hidden data-i="วันนี้">วันนี้</button><button class="btn sm primary" id="share-last" data-i="แชร์" data-pre="↗ ">↗ แชร์</button></span></div>
    <input type="hidden" id="day"><div class="date" id="date" style="margin:0"></div>
    <div class="fold">
      <div class="stats" id="stats"></div>
      <div class="cal">
        <div class="cal-head"><button class="btn sm" id="cal-prev" aria-label="Previous month">‹</button><b id="cal-title"></b><button class="btn sm" id="cal-next" aria-label="Next month">›</button></div>
        <div class="cal-grid" id="cal-grid"></div>
      </div>
    </div>
  </section>

  <!-- FOOD -->
  <div id="v-food" class="stack" style="gap:18px">
    <section class="totals" aria-label="Totals">
      <div class="bar"><div class="bar-top"><span data-i="แคลอรี">แคลอรี</span><b id="kcal-t"></b></div><div class="track"><div class="fill" id="kcal-f"></div></div></div>
      <div class="bar"><div class="bar-top"><span data-i="โปรตีน">โปรตีน</span><b id="p-t"></b></div><div class="track"><div class="fill" id="p-f"></div></div></div>
      <p class="note" id="status"></p>
    </section>
    <section>
      <div class="step" style="margin-bottom:8px"><span class="num">2</span><span class="step-t" data-i="เลือกประเภทวัน">เลือกประเภทวัน</span></div>
      <div class="chips">
        <button class="chip" id="t-run" data-k="run" aria-pressed="false" data-i="วิ่ง" data-pre="🏃 ">🏃 วิ่ง</button>
        <button class="chip" id="t-bad" data-k="bad" aria-pressed="false" data-i="ตีแบด" data-pre="🏸 ">🏸 ตีแบด</button>
        <button class="chip" id="t-late" data-k="late" aria-pressed="false" data-i="เวทค่ำ" data-pre="🏋️ ">🏋️ เวทค่ำ</button>
      </div>
    </section>
    <div class="step"><span class="num">3</span><span class="step-t" data-i="ติ๊กมื้อที่กินแล้ว">ติ๊กมื้อที่กินแล้ว</span></div>
    <section class="stack" id="meals"></section>
    <section>
      <div class="label" data-i="โปรตีน 7 วัน">โปรตีน 7 วัน</div>
      <div class="hist" id="hist"></div>
    </section>
    <button class="btn ghost" id="reset" style="align-self:start" data-i="ล้างวันนี้">ล้างวันนี้</button>
    <section>
      <div class="label" data-i="ประวัติ">ประวัติ</div>
      <div class="stack" id="food-hist"></div>
    </section>
  </div>

  <!-- GYM -->
  <div id="v-gym" class="stack" style="gap:16px" hidden>
    <section class="hero" id="hero"><canvas id="hero-cv" width="20" height="24" style="width:60px;height:72px"></canvas><div class="hero-i"><div class="hero-l"><b id="hero-lv">Lv 1</b><span id="hero-tier"></span></div><div class="track"><div class="fill" id="hero-fill"></div></div><div class="hero-l"><span id="hero-xp"></span><span id="hero-next"></span></div></div></section>
    <section class="stepbox">
      <div class="step"><span class="num" id="sn-2">2</span><span class="step-t" data-i="เลือกโปรแกรม">เลือกโปรแกรม</span></div>
      <div class="prog-pick" id="progs"></div>
    </section>
    <section class="stepbox" id="step3">
      <div class="step"><span class="num" id="sn-3">3</span><span class="step-t" data-i="กรอกน้ำหนัก">กรอกน้ำหนัก</span><button class="btn sm" id="edit-mode" style="margin-left:auto">แก้ไขท่า</button><button class="btn sm ghost" id="cancel-prog" aria-label="Cancel">✕</button></div>
      <p class="note" id="pick-hint" data-i="เลือกโปรแกรมด้านบนก่อน">เลือกโปรแกรมด้านบนก่อน</p>
      <div class="stack" id="exs"></div>
    </section>
    <section class="stepbox" id="step4">
      <div class="step"><span class="num" id="sn-4">4</span><span class="step-t" data-i="บันทึก">บันทึก</span></div>
      <div class="actions">
      <button class="btn primary" id="save-w" data-i="บันทึก">บันทึก</button>
      <span class="note" id="save-day" style="align-self:center;font-family:var(--f-num)"></span>
      <button class="btn ghost" id="clear-w" data-i="ล้าง">ล้าง</button>
      </div>
    </section>
    <section id="hist-sec">
      <div class="label" data-i="ประวัติ">ประวัติ</div>
      <div class="stack" id="sessions"></div>
    </section>
  </div>

  <section class="rules" style="display:grid;gap:8px">
    <div class="label" style="margin:0" data-i="ข้อมูล">ข้อมูล</div>
    <p class="note" id="sync"></p>
    <div class="actions"><button class="btn sm" id="export">Export JSON</button><button class="btn sm" id="import" data-i="นำเข้า JSON">นำเข้า JSON</button><input type="file" id="import-file" accept="application/json,.json" hidden></div>
    <div class="label" style="margin:8px 0 0">Face ID</div>
    <p class="note" id="pk-state"></p>
    <div class="actions"><button class="btn sm primary" id="pk-add" data-i="ตั้งค่า Face ID">ตั้งค่า Face ID</button></div>
    <div class="label" style="margin:8px 0 0" data-i="แจ้งเตือน">แจ้งเตือน</div>
    <p class="note" id="push-state"></p>
    <div class="actions"><button class="btn sm primary" id="push-on" data-i="เปิดแจ้งเตือน">เปิดแจ้งเตือน</button><button class="btn sm" id="push-test" hidden data-i="ส่งทดสอบ">ส่งทดสอบ</button></div>
    <textarea id="export-box" hidden readonly rows="6" style="width:100%;box-sizing:border-box;background:var(--bg);color:var(--fg);border:1px solid var(--line);border-radius:4px;font-family:var(--f-num);font-size:.75rem"></textarea>
  </section>
</div>
<div class="toast" id="toast" hidden></div>
<div id="ptr" aria-hidden="true"><span id="ptr-i">↓</span></div>
<div class="modal" id="login" hidden role="dialog" aria-modal="true" aria-label="Login">
  <form class="modal-in" id="login-form" style="max-width:320px">
    <h1 style="margin:0">Fuel &amp; Lift</h1>
    <label class="label" for="pin" style="margin:0">PIN</label>
    <input id="pin" type="password" inputmode="numeric" autocomplete="current-password" required style="background:var(--surface);color:var(--fg);border:1px solid var(--line);border-radius:6px;padding:12px;font-family:var(--f-num);font-size:1.2rem;letter-spacing:.3em;text-align:center">
    <p class="note" id="login-err" hidden style="color:var(--warn)">Wrong PIN</p>
    <button class="btn primary" type="submit">Unlock</button>

let food=load("mealcheck",{}); food[TODAY]=food[TODAY]||{done:{},tags:{}};

function mealList(){const t=fs().tags;const l=MEALS.map(m=>({...m}));if(t.late){l.find(x=>x.id==="m4").time="18:00";l.find(x=>x.id==="v2").time="18:15"}if(t.run)l.push(EXTRAS.run);if(t.bad)l.push(EXTRAS.bad);return l}
function dayP(day){const d=food[day];if(!d)return null;let p=0;[...MEALS,EXTRAS.run,EXTRAS.bad].forEach(m=>{if(d.done[m.id])p+=m.p});return p}
function renderFoodHist(){
  const box=document.getElementById("food-hist");box.innerHTML="";
  const days=Object.keys(food).filter(d=>food[d]&&Object.values(food[d].done||{}).some(Boolean)).sort().reverse().slice(0,30);
  if(!days.length){box.innerHTML='<p class="note">—</p>';return}
  days.forEach(ds=>{const d=food[ds],tg=d.tags||{};const all=[...MEALS,EXTRAS.run,EXTRAS.bad];
    const eaten=all.filter(m=>d.done[m.id]);const k=eaten.reduce((a,m)=>a+m.k,0),p=eaten.reduce((a,m)=>a+m.p,0);
    const planned=MEALS.length+(tg.run?1:0)+(tg.bad?1:0);
    const el=document.createElement("details");el.className="ex log";
    el.innerHTML=`<summary><b>${thDate(ds,{weekday:"short",day:"numeric",month:"short"})}</b> · ${k} kcal · <span style="color:${p>=P_TARGET?"var(--up)":"inherit"}">P${p}</span> · ${eaten.length}/${planned}${tg.run?" 🏃":""}${tg.bad?" 🏸":""}${tg.late?" 🏋️":""}</summary>
      <table>${all.filter(m=>m.id[0]!=="x"||(m.id==="x-run"&&tg.run)||(m.id==="x-bad"&&tg.bad)).map(m=>`<tr><td>${d.done[m.id]?"✓":"·"}</td><td>${m.time.length<6?m.time:t(m.time)}</td><td>${t(m.name)}</td><td>${m.vit?"💊":m.k+" kcal"}</td></tr>`).join("")}</table>

    box.appendChild(el)});
}
function renderFood(){renderFoodHist();
  document.querySelectorAll(".chip").forEach(c=>c.setAttribute("aria-pressed",!!fs().tags[c.dataset.k]));
  const box=document.getElementById("meals");box.innerHTML="";
  const meals=mealList();
  meals.forEach(m=>{
    const done=!!fs().done[m.id];
    const el=document.createElement("label");el.className="meal"+(done?" done":"")+(m.id.startsWith("x")?" extra":"");
    el.innerHTML=`<input type="checkbox" id="c-${m.id}" ${done?"checked":""}><div><div class="row-head"><span><span class="time">${t(m.time)}</span> · ${t(m.name)}</span><span class="macro">${m.vit?"💊":`${m.k} kcal · P${m.p}`}</span></div><ul>${m.items.map(i=>`<li>${t(i)}</li>`).join("")}</ul></div>`;
    el.querySelector("input").addEventListener("change",e=>{fs().done[m.id]=e.target.checked;save("mealcheck",food);renderFood()});
    box.appendChild(el);
  });
  let k=0,p=0,kt=0;meals.forEach(m=>{kt+=m.k;if(fs().done[m.id]){k+=m.k;p+=m.p}});
  document.getElementById("kcal-t").textContent=`${k} / ${kt}`;
  document.getElementById("p-t").textContent=`${p} / ${P_TARGET} g`;
  document.getElementById("kcal-f").style.width=Math.min(100,k/kt*100)+"%";
  document.getElementById("p-f").style.width=Math.min(100,p/P_TARGET*100)+"%";
  const left=meals.filter(m=>!fs().done[m.id]);
  document.getElementById("status").textContent=left.length===0?t("ครบทุกมื้อแล้ว ✅"):
    p>=P_TARGET?`${t("ถึงเป้าแล้ว")} · ${left.length} ${t("เหลือ")}`:`${t("ขาดโปรตีน")} ${P_TARGET-p} g · ${t("ถัดไป")} ${left[0].time} ${t(left[0].name)}`;
  const h=document.getElementById("hist");h.innerHTML="";
  for(let i=6;i>=0;i--){const d=new Date(DAY+"T12:00:00");d.setDate(d.getDate()-i);const kk=dkey(d);const p2=dayP(kk);
    const el=document.createElement("div");el.className="day"+(p2!==null&&p2>=P_TARGET?" hit":"");
    el.innerHTML=`${d.toLocaleDateString(LOC(),{weekday:"short"})}<b>${p2===null?"–":p2}</b>`;h.appendChild(el)}
}

function commitDraft(day,prog){

const PAL=[["#7d7a74","#4a4844"],["#d9a46c","#8a6237"],["#f2d36b","#a8862a"]];

function drawHero(cv,tier,pose,f){const c=cv.getContext("2d");c.clearRect(0,0,20,24);

  if(tier>0){R(tx+1,ty+1,tw/2-1,2,sd);R(10,ty+1,tw/2-1,2,sd)}
  // head

  if(pose==="push"){const up=f?0:4;R(lx,ty-6+up,aw,7-up,skin);R(rx,ty-6+up,aw,7-up,skin);R(1,ty-7+up,18,1,bar);R(0,ty-9+up,2,5,"#555");R(18,ty-9+up,2,5,"#555")}
  else if(pose==="pull"){const up=f?2:6;R(lx,ty-up,aw,up+1,skin);R(rx,ty-up,aw,up+1,skin);R(2,ty-up-1,16,1,bar)}
  else if(pose==="legs"){R(lx,ty-1,aw,3,skin);R(rx,ty-1,aw,3,skin);R(1,ty-2,18,1,bar);R(0,ty-4,2,5,"#555");R(18,ty-4,2,5,"#555")}
  else{const b=f?1:0;R(lx,ty+b,aw,6,skin);R(rx,ty+b,aw,6,skin)}}

let col=null,dirty=new Set(),syncT=null,syncing=false,syncedLogs={};
const logId=l=>`g-${l.date}-${l.prog}`;
function syncMsg(t){document.getElementById("sync").textContent=t}
let foodDirty=new Set();
function markDirty(k){if(k==="mealcheck")foodDirty.add(DAY);if(!col)return;dirty.add(k);clearTimeout(syncT);syncT=setTimeout(flush,800)}
async function flush(){
  if(syncing){syncT=setTimeout(flush,500);return}
  syncing=true;const keys=[...dirty];dirty.clear();
  try{
    for(const k of keys){
      if(k==="mealcheck"){const ds=[...foodDirty];foodDirty.clear();for(const dd of ds)await col.doc("f-"+dd).set({date:dd,...food[dd]})}
      if(k==="gymlog"){
        const now2={};logs.forEach(l=>now2[logId(l)]=JSON.stringify(l));
        for(const id in now2)if(syncedLogs[id]!==now2[id]){await col.doc(id).set(JSON.parse(now2[id]));syncedLogs[id]=now2[id]}
        for(const id in syncedLogs)if(!(id in now2)){await col.doc(id).delete();delete syncedLogs[id]}
      }
      if(k==="restcfg"||k==="gymdraft"||k==="progs"||k==="unit")await col.doc("settings").set({restCfg,draft,progs:PROGS,unit,scheme:3});
    }
    syncMsg(t("ซิงก์แล้ว ✓"));
  }catch(e){keys.forEach(k=>dirty.add(k));syncMsg(t("ซิงก์ไม่สำเร็จ"))}
  syncing=false;
}
async function cloudLoad(){
  const timer=setTimeout(()=>{if(!col)syncMsg(t("ออฟไลน์ · เก็บในเครื่องนี้"))},10000);
  try{
    const c=API;let snap;
    try{snap=await c.get()}catch(e){clearTimeout(timer);if(e&&e.code==="auth"){showLogin();syncMsg(t("ออฟไลน์ · เก็บในเครื่องนี้"));return}throw e}
    clearTimeout(timer);
    const toUpload=new Set();
    if(snap.empty){toUpload.add("gymlog");toUpload.add("restcfg");}
    const seenF=new Set();
    snap.docs.forEach(d=>{const v=JSON.parse(JSON.stringify(d.data()||{}));
      if(d.id.startsWith("f-")){const {date,...rest}=v;food[date]=rest;seenF.add(date)}
      else if(d.id.startsWith("g-")){const i=logs.findIndex(l=>logId(l)===d.id);if(i>=0)logs[i]=v;else logs.push(v);syncedLogs[d.id]=JSON.stringify(v)}
      else if(d.id==="settings"){Object.assign(restCfg,v.restCfg||{});if(v.progs){PROGS=v.progs;if((v.scheme||1)<3){to5x5();toUpload.add("progs")}}if(v.unit)unit=v.unit;if(v.draft&&v.draft.prog&&!draft.prog)draft=v.draft}
    });
    logs.sort((a,b)=>a.date.localeCompare(b.date));
    food[TODAY]=food[TODAY]||{done:{},tags:{}};
    col=c;
    // ย้ายข้อมูลเดิมในเครื่องที่ยังไม่เคยอยู่บนบัญชี
    for(const date of Object.keys(food))if(!seenF.has(date)&&Object.keys(food[date].done||{}).length){await c.doc("f-"+date).set({date,...food[date]})}
    if(logs.some(l=>!syncedLogs[logId(l)]))toUpload.add("gymlog");
    try{localStorage.setItem("mealcheck",JSON.stringify(food));localStorage.setItem("gymlog",JSON.stringify(logs))}catch(e){}
    toUpload.forEach(k=>dirty.add(k));if(dirty.size)await flush();
    syncMsg(t("ซิงก์แล้ว ✓"));
    autoCommitOld();
    if(!PROGS[cur])cur=nextProg();cur=draft.prog&&PROGS[draft.prog]?draft.prog:nextProg();updUnitBtn();renderFood();renderGym();
  }catch(e){clearTimeout(timer);syncMsg(t("ออฟไลน์ · เก็บในเครื่องนี้"))}
}

function weekStreak(){const wk=new Set(logs.map(l=>weekKey(l.date)));let d=new Date(TODAY+"T12:00:00");let k=weekKey(TODAY);if(!wk.has(k)){d.setDate(d.getDate()-7);k=weekKey(dkey(d))}let n=0;while(wk.has(k)){n++;d.setDate(d.getDate()-7);k=weekKey(dkey(d))}return n}

/* ---------- share card (canvas → PNG) ---------- */
let shareBlob=null,shareName="";
async function svgImg(svg){const im=new Image();await new Promise((ok,no)=>{im.onload=ok;im.onerror=no;im.src="data:image/svg+xml;charset=utf-8,"+encodeURIComponent(svg)});return im}
async function drawCard(l){
  try{await document.fonts.ready}catch(e){}
  const ids=Object.keys(l.ex);const W=1080,H=2340,P=80;
  const grp=(s,u)=>{const out=[];s.forEach(q=>{const k=`${toDisp(q.kg,u)}${u} × ${q.reps}`;const last=out[out.length-1];if(last&&last.k===k)last.n++;else out.push({k,n:1})});return out.map(o=>o.n>1?`${o.k}  ×${o.n}`:o.k)};
  const top=780,avail=H-top-150;const rowRaw=ids.map(id=>Math.max(2,grp(l.ex[id],uOf(id)).length)*52+70);
  const fit=Math.min(1,avail/rowRaw.reduce((a,b)=>a+b,0));const rowH=rowRaw.map(r=>r*fit);
  const c=document.createElement("canvas");c.width=W;c.height=H;const x=c.getContext("2d");
  const sans='"IBM Plex Sans Thai",system-ui,sans-serif',mono='"IBM Plex Mono",monospace',serif='"Noto Serif Thai",Georgia,serif';
  const BLUE="#3d7dff",GREEN="#2ad19a",FG="#f2f0ec",MUTED="#8a8780";
  x.fillStyle="#000";x.fillRect(0,0,W,H);
  x.strokeStyle="#262625";x.lineWidth=3;x.beginPath();x.roundRect?x.roundRect(30,30,W-60,H-60,48):x.rect(30,30,W-60,H-60);x.stroke();
  // header
  x.fillStyle=FG;x.font=`700 40px ${mono}`;x.fillText("FUEL & LIFT",P,P+70);
  x.fillStyle=MUTED;x.font=`400 38px ${sans}`;
  x.fillText(new Date(l.date+"T12:00:00").toLocaleDateString(LOC(),{month:"short",day:"numeric",year:"numeric"}),P,P+135);
  const pname=(PROGS[l.prog]||{name:l.prog}).name;x.fillText(pname,P,P+185);
  // ring + muscle map
  const cx=W-P-160,cy=P+170,R=150;
  const planned=ids.reduce((a,id)=>{for(const p of Object.values(PROGS)){const e=p.ex.find(q=>q.id===id);if(e)return a+e.s}return a+l.ex[id].length},0);
  const sets=Object.values(l.ex).flat().length;
  const wk=weekKey(l.date);const wkDays=new Set(logs.filter(q=>weekKey(q.date)===wk&&q.date<=l.date).map(q=>q.date)).size;
  x.lineCap="round";
  x.strokeStyle="#262a33";x.lineWidth=22;x.beginPath();x.arc(cx,cy,R,0,Math.PI*2);x.stroke();
  x.strokeStyle=BLUE;x.beginPath();x.arc(cx,cy,R,-Math.PI/2,-Math.PI/2+Math.PI*2*Math.min(1,sets/Math.max(1,planned)));x.stroke();
  x.strokeStyle="#1d2b26";x.lineWidth=18;x.beginPath();x.arc(cx,cy,R-30,0,Math.PI*2);x.stroke();
  x.strokeStyle=GREEN;x.beginPath();x.arc(cx,cy,R-30,-Math.PI/2,-Math.PI/2+Math.PI*2*Math.min(1,wkDays/5));x.stroke();
  x.textAlign="center";x.fillStyle=FG;x.font=`700 72px ${sans}`;x.fillText(`${wkDays}/5`,cx,cy+18);x.fillStyle=MUTED;x.font=`500 24px ${mono}`;x.fillText("THIS WEEK",cx,cy+58);x.textAlign="left";
  // stats
  const days=workoutDays().filter(d=>d<=l.date).length;
  const vol=Math.round(volOf(l)).toLocaleString();
  [[String(days),t("วันที่เล่น"),FG],[vol,"Volume kg",BLUE],[String(sets),"Sets",GREEN]].forEach(([v,lab,col],i)=>{
    const mx=W/6+i*W/3;x.textAlign="center";x.fillStyle=col;x.font=`700 84px ${sans}`;x.fillText(v,mx,P+500);
    x.font=`500 34px ${sans}`;x.fillText(lab,mx,P+555);x.textAlign="left"});
  // rows
  let y=top;const f=fit;
  for(let k=0;k<ids.length;k++){const id=ids[k],u=uOf(id),s=l.ex[id];
    const ex=Object.values(PROGS).flatMap(p=>p.ex).find(e=>e.id===id)||{id,n:exName(id,l)};
    x.fillStyle=FG;x.font=`700 ${Math.round(40*f)}px ${sans}`;let nm=exName(id,l);while(x.measureText(nm).width>600&&nm.length>4)nm=nm.slice(0,-2);if(nm!==exName(id,l))nm+="…";x.fillText(nm,P,y+32*f);
    const e1=Math.max(...s.map(q=>(+q.kg||0)*(1+(+q.reps||0)/30)));
    x.fillStyle="#bdbab4";x.font=`400 ${Math.round(34*f)}px ${sans}`;x.fillText(`e1RM ${toDisp(Math.round(e1*10)/10,u)}${u}`,P,y+82*f);
    x.textAlign="right";grp(s,u).forEach((tx,r)=>{x.fillStyle=FG;x.font=`400 ${Math.round(36*f)}px ${sans}`;x.fillText(tx,W-P,y+32*f+r*52*f)});x.textAlign="left";
    y+=rowH[k]}
  x.fillStyle=MUTED;x.font=`500 30px ${mono}`;x.textAlign="center";x.fillText(`🏆 ${weekStreak()} ${t("สัปดาห์ติดกัน").toUpperCase()}`,W/2,H-100);x.textAlign="left";
  return new Promise(r=>c.toBlob(b=>r(b),"image/png"));
}
async function openShare(l){
  if(!l){toast(t("ยังไม่มีบันทึก"));return}
  shareBlob=await drawCard(l);shareName=`workout-${l.date}-${l.prog}.png`;
  const img=document.getElementById("share-img");if(img.src)URL.revokeObjectURL(img.src);img.src=URL.createObjectURL(shareBlob);
  document.getElementById("share-hint").hidden=true;document.getElementById("open-ig").hidden=true;document.getElementById("open-ig-web").hidden=true;document.getElementById("share-modal").hidden=false;
}
document.getElementById("share-last").addEventListener("click",()=>{
  const ds=logs.filter(l=>l.date===DAY);
  if(!ds.length){toast(t("วันนี้ไม่มีบันทึกเวท"));return}
  if(ds.length===1){openShare(ds[0]);return}
  const ex={},names={};ds.forEach(l=>{Object.assign(ex,l.ex);Object.assign(names,l.names||{})});
  openShare({date:DAY,prog:ds.map(l=>(PROGS[l.prog]||{name:l.prog}).name).join(" + "),ex,names});
});
document.getElementById("share-close").addEventListener("click",()=>document.getElementById("share-modal").hidden=true);
async function storyBlob(){
  const im=new Image();const url=URL.createObjectURL(shareBlob);await new Promise(r=>{im.onload=r;im.src=url});
  const W=1080,H=1920,c=document.createElement("canvas");c.width=W;c.height=H;const x=c.getContext("2d");
  const g=x.createLinearGradient(0,0,0,H);g.addColorStop(0,"#141414");g.addColorStop(1,"#000");x.fillStyle=g;x.fillRect(0,0,W,H);
  const sc=Math.min((W-80)/im.width,(H-360)/im.height,1);const w=im.width*sc,h=im.height*sc;
  x.drawImage(im,(W-w)/2,(H-h)/2,w,h);URL.revokeObjectURL(url);
  return new Promise(r=>c.toBlob(b=>r(b),"image/png"));
}
document.getElementById("share-story").addEventListener("click",async()=>{
  const b=await storyBlob();const name=shareName.replace(".png","-story.png");
  if(await shareFile(b,name))return;
  downloadBlob(b,name);toast(t("บันทึกแล้ว เปิด IG เพื่อลง Story"));document.getElementById("open-ig").hidden=false;document.getElementById("open-ig-web").hidden=false;return;
  const img=document.getElementById("share-img");URL.revokeObjectURL(img.src);img.src=URL.createObjectURL(b);
  const h=document.getElementById("share-hint");h.textContent=t("กดค้างที่รูปเพื่อบันทึก");h.hidden=false;
});
document.getElementById("share-save").addEventListener("click",async()=>{
  if(await shareFile(shareBlob,shareName))return;
  downloadBlob(shareBlob,shareName);toast(t("รูปถูกส่งแล้ว"));return;

});



/* ---------- refresh (soft, throttled) ---------- */
let lastRefresh=Date.now(),refreshing=false;const COOLDOWN=15000;
async function doRefresh(){
  if(refreshing)return;
  if(Date.now()-lastRefresh<COOLDOWN){const s=Math.ceil((COOLDOWN-(Date.now()-lastRefresh))/1000);toast(lang==="th"?`เพิ่งอัปเดตไป รีเฟรชได้อีกใน ${s} วินาที`:`Just updated. Refresh again in ${s}s`);return}
  refreshing=true;lastRefresh=Date.now();
  try{clearTimeout(syncT);if(dirty.size)await flush();await cloudLoad();toast(t("อัปเดตแล้ว"))}catch(e){toast(t("ซิงก์ไม่สำเร็จ"))}finally{refreshing=false}
}

/* ---------- pull to refresh ---------- */
(()=>{const el=document.getElementById("ptr"),ic=document.getElementById("ptr-i");let y0=null,dy=0;const MAX=110,TRIG=80;
  const modalOpen=()=>[...document.querySelectorAll(".modal")].some(m=>!m.hidden);
  window.addEventListener("touchstart",e=>{if(window.scrollY<=0&&!modalOpen()&&e.touches.length===1){y0=e.touches[0].clientY;dy=0}else y0=null},{passive:true});
  window.addEventListener("touchmove",e=>{if(y0===null)return;dy=e.touches[0].clientY-y0;if(dy<=0||window.scrollY>0){el.style.opacity=0;el.style.transform="translateY(-80px)";return}
    const d=Math.min(MAX,dy*0.5);el.classList.add("on");el.style.opacity=Math.min(1,d/TRIG*1.2);el.style.transform=`translateY(${d-20}px) rotate(${d*3}deg)`;
    el.classList.toggle("ready",d>=TRIG*0.75);ic.textContent=d>=TRIG*0.75?"↻":"↓"},{passive:true});
  window.addEventListener("touchend",()=>{if(y0===null)return;el.classList.remove("on");
    if(Math.min(MAX,dy*0.5)>=TRIG*0.75){el.classList.add("spin");el.style.transform="translateY(40px)";ic.textContent="↻";doRefresh().finally(()=>{el.classList.remove("spin","ready");el.style.opacity=0;el.style.transform="translateY(-80px)"})}
    else{el.style.opacity=0;el.style.transform="translateY(-80px)";el.classList.remove("ready")}y0=null},{passive:true});
})();
