<!doctype html><html><head><meta charset="utf-8"><style>
:root{--a:#ff8a3d;--a2:#f97316;--g:#3a1d0c;--g2:#5a2c10;--g3:#3a2416;--bg:#0a0b0d;--c:#16181c}
*{box-sizing:border-box;margin:0}body{background:#e9ebea;font-family:"IBM Plex Sans",Arial,sans-serif;display:grid;grid-template-columns:repeat(4,360px);gap:56px 26px;padding:46px 28px 28px;color:#fff}
.w{position:relative}.lab{position:absolute;top:-30px;left:4px;color:#222;font-weight:700;font-size:15px}
.ph{width:360px;height:760px;border-radius:44px;border:9px solid #111;overflow:hidden;padding:44px 16px 0;background:radial-gradient(120% 42% at 50% 0%,var(--g),var(--bg) 62%);position:relative}
.h1{font-size:27px;font-weight:600;line-height:1.15}.h1 i{color:var(--a);font-family:Georgia,serif;font-weight:400}
.sm{color:#c9ccd2;font-size:13px}.row{display:flex;justify-content:space-between;align-items:center}
.b{width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.08);display:grid;place-items:center;font-size:16px}
.av{width:40px;height:40px;border-radius:50%;background:linear-gradient(135deg,var(--a),var(--a2));display:grid;place-items:center;color:#1a0d04;font-weight:800}
.days{display:flex;gap:5px;margin-top:12px}.d{flex:1;height:60px;border-radius:20px;background:rgba(255,255,255,.05);display:grid;place-items:center;font-size:11px;color:#aab;position:relative}.d b{color:#fff;font-size:14px}.d.on{outline:2px solid var(--a)}.d.ok::before{content:"";position:absolute;top:-5px;width:8px;height:8px;border-radius:50%;background:var(--a)}
.ch{margin:12px 0;height:62px;border-radius:32px;background:linear-gradient(90deg,var(--a),var(--a2));display:flex;align-items:center;gap:10px;padding:0 8px;color:#1a0d04}.ch .i{width:46px;height:46px;border-radius:50%;background:#1a0d04;display:grid;place-items:center}.ch b{font-size:15px}.bar{height:4px;background:rgba(0,0,0,.2);border-radius:2px;margin-top:5px}.bar i{display:block;height:100%;width:70%;background:#1a0d04;border-radius:2px}.go{margin-left:auto;width:46px;height:46px;border-radius:50%;background:#fff;display:grid;place-items:center}
.card{background:var(--c);border-radius:22px;padding:14px;margin-top:10px}
.pc{height:200px;border-radius:24px;background:#222 center/cover;position:relative;overflow:hidden;margin-top:10px}.pc::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 35%,rgba(0,0,0,.88))}.pc .t{position:absolute;left:14px;bottom:12px;z-index:2}.pc .t b{font-size:18px;display:block}
.pill{position:absolute;left:12px;top:12px;z-index:2;background:rgba(0,0,0,.55);border-radius:16px;padding:5px 10px;font-size:12px}.hrt{position:absolute;right:12px;top:12px;z-index:2;width:34px;height:34px;border-radius:50%;background:#fff;color:#1a0d04;display:grid;place-items:center}
.st{position:absolute;right:12px;bottom:12px;z-index:2;background:linear-gradient(90deg,var(--a),var(--a2));color:#1a0d04;font-weight:700;border-radius:20px;padding:8px 16px;font-size:14px}
.chips{display:flex;gap:6px;margin:12px 0 0}.chip{padding:9px 14px;border-radius:24px;background:var(--c);font-size:13px;white-space:nowrap}.chip.on{border:1.5px solid var(--a);background:none}
.tab{position:absolute;left:0;right:0;bottom:0;height:84px;background:#0f1012;display:flex;justify-content:space-around;align-items:center;font-size:11px;color:#8b8f97}.tab div{display:grid;justify-items:center;gap:3px}.tab .on{color:var(--a)}.fab{width:62px;height:62px;border-radius:50%;background:var(--a);margin-top:-40px;display:grid;place-items:center;color:#1a0d04;font-size:24px;box-shadow:0 0 0 7px #0f1012,0 0 22px rgba(255,138,61,.5)}
.mac{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center;font-size:11px;color:#aab;margin-top:10px}.mac b{display:block;color:#fff;font-size:17px}.mac em{display:block;height:4px;border-radius:2px;background:#2a2c31;margin-top:5px}.mac em i{display:block;height:100%;border-radius:2px}
.cta{position:absolute;left:16px;right:16px;bottom:24px;height:54px;border-radius:28px;background:linear-gradient(90deg,var(--a),var(--a2));color:#1a0d04;font-weight:700;display:grid;place-items:center;font-size:16px;box-shadow:0 0 22px rgba(255,138,61,.4)}
.hero{margin:-44px -16px 0;height:330px;background:#fff center 60%/contain no-repeat;position:relative}.hero .nv{position:absolute;top:48px;left:14px;right:14px;display:flex;justify-content:space-between}.hero .nv span{height:38px;min-width:38px;padding:0 10px;border-radius:20px;background:rgba(0,0,0,.6);display:grid;place-items:center;font-size:13px}
.ex{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid #23252a;font-size:14px}.no{width:26px;height:26px;border-radius:50%;background:#23252a;display:grid;place-items:center;font-size:12px}.ex .n{flex:1}.ex small{color:#8b8f97}.how{color:var(--a);font-size:13px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}.tl{border-radius:18px;background:linear-gradient(180deg,#16181c,var(--g3));padding:11px;height:128px;position:relative;font-size:12px}.tl.s{height:84px}.tl .v{position:absolute;left:11px;bottom:10px;font-size:21px}.tl .v small{font-size:11px;color:#c8ccd3}.tl svg{position:absolute;left:8px;top:38px;width:calc(100% - 16px)}
.li{display:flex;align-items:center;gap:12px;padding:14px;background:var(--c);border-radius:16px;margin-top:8px;font-size:14px}.li .mi{width:34px;height:34px;border-radius:10px;background:rgba(255,138,61,.15);color:var(--a);display:grid;place-items:center}
</style><style>
.dim{position:absolute;inset:0;background:rgba(0,0,0,.6)}
.sheet{position:absolute;left:0;right:0;bottom:0;background:#15171b;border-radius:28px 28px 0 0;padding:14px 18px 26px;border-top:1px solid #2a2c31}
.grab{width:44px;height:5px;border-radius:3px;background:#3a3c42;margin:0 auto 14px}
.sheet h3{font-size:20px;margin-bottom:6px}.sheet p{color:#aab;font-size:14px;margin-bottom:16px}
.btns{display:grid;grid-template-columns:1fr 2fr;gap:10px}.bt{height:52px;border-radius:26px;display:grid;place-items:center;font-weight:700;font-size:15px}
.bt.g{background:#23252a;color:#fff}.bt.o{background:linear-gradient(90deg,var(--a),var(--a2));color:#1a0d04}.bt.r{background:#ef4444;color:#fff}
.toast{position:absolute;left:50%;transform:translateX(-50%);bottom:110px;background:#f3f4f6;color:#111;border-radius:22px;padding:12px 18px;font-size:14px;white-space:nowrap;box-shadow:0 8px 24px rgba(0,0,0,.4)}
.ic{width:56px;height:56px;border-radius:50%;display:grid;place-items:center;font-size:24px;margin-bottom:10px}
.savebar{position:absolute;left:0;right:0;bottom:0;padding:14px 16px 26px;background:rgba(10,11,13,.95);border-top:1px solid #2a2c31;display:grid;grid-template-columns:1fr 2fr;gap:10px}
.fld{background:#0f1012;border:1px solid #2a2c31;border-radius:14px;padding:12px;font-size:14px;margin-top:8px}
.err{border-color:#ef4444}.et{color:#fca5a5;font-size:12px;margin-top:4px}
</style></head><body><script>
const BG=`<div class="sm">Sunday 22 November</div><div class="h1">What do I <i>train today?</i></div><div class="pc" style="background-image:url(rest-bg.jpg)"><div class="t"><b>Pull B</b></div></div><div class="li"><span class="mi">💪</span><b>Lat Pulldown</b></div><div class="li"><span class="mi">💪</span><b>Seated Cable Row</b></div>`;
const SH=(icbg,ic,h,p,b1,b2,cls)=>`${BG}<div class="dim"></div><div class="sheet"><div class="grab"></div><div class="ic" style="background:${icbg}">${ic}</div><h3>${h}</h3><p>${p}</p><div class="btns"><span class="bt g">${b1}</span><span class="bt ${cls}">${b2}</span></div></div>`;
const S=[
["A1 · Add exercise — confirm",SH("rgba(255,138,61,.15)","＋","Add this exercise?","Barbell Row · 3 sets × 8-12","Cancel","+ Add","o")],
["A2 · Remove exercise — confirm",SH("rgba(239,68,68,.15)","🗑","Remove this exercise?","Lat Pulldown — sets logged for it will be lost","Keep","Remove","r")],
["A3 · Remove last set",SH("rgba(239,68,68,.15)","−","Remove the last set?","Lat Pulldown · Set 4","Keep","Remove set","r")],
["A4 · Finish early",SH("rgba(255,138,61,.15)","✓","Finish now?","Done 7/14 sets · unticked sets won't be saved","Keep going","✓ Save what I did","o")],
["A5 · Cancel workout",SH("rgba(239,68,68,.15)","✕","Discard all?","All sets you did will be lost","Keep going","Discard all","r")],
["A6 · Delete program",SH("rgba(239,68,68,.15)","🗑","Delete program?","Pull B — this can't be undone. History stays.","Cancel","Delete","r")],
["A7 · Editor — unsaved changes",`<div class="row"><b>✎ Pull B</b><span class="b">✕</span></div><div class="fld">Pull B</div><div class="sm" style="margin-top:12px">Place</div><div class="chips"><span class="chip on">🏢 Gym</span><span class="chip">🏠 Condo</span></div><div class="li"><span class="no">1</span><span style="flex:1"><b>Lat Pulldown</b><br><small class="sm">4 × 8-10</small></span><span class="sm">↑ ↓ ⇄ 🗑</span></div><div class="li"><span class="no">2</span><span style="flex:1"><b>Deadlift</b><br><small class="sm">3 × 5-8</small></span><span class="sm">↑ ↓ ⇄ 🗑</span></div><div class="dim"></div><div class="sheet"><div class="grab"></div><h3>Save changes?</h3><p>You edited Pull B. Leave without saving?</p><div style="display:grid;grid-template-columns:1fr 1fr 1.4fr;gap:8px"><span class="bt g">Back</span><span class="bt r">Discard</span><span class="bt o">✓ Save</span></div></div>`],
["A8 · Saved — toast",`<div class="sm">Sunday 22 November</div><div class="h1">What do I <i>train today?</i></div><div class="pc" style="background-image:url(rest-bg.jpg)"><span class="st">Start</span><div class="t"><b>Pull B</b></div></div><div class="toast">✓ Changes saved &nbsp;·&nbsp; <b style="color:var(--a2)">Undo</b></div>`],
["A9 · Workout complete",`<div style="text-align:center;margin-top:70px"><div style="width:120px;height:120px;margin:0 auto;border-radius:50%;background:linear-gradient(135deg,var(--a),var(--a2));display:grid;place-items:center;font-size:56px;color:#1a0d04;box-shadow:0 0 40px rgba(255,138,61,.6)">✓</div><div class="h1" style="margin-top:20px">Workout <i>complete!</i></div><p class="sm" style="margin-top:6px">Pull B · 42 min</p></div><div class="grid" style="grid-template-columns:repeat(3,1fr)"><div class="tl s" style="text-align:center">Sets<div class="v" style="left:0;right:0">21</div></div><div class="tl s" style="text-align:center">kg<div class="v" style="left:0;right:0">1,684</div></div><div class="tl s" style="text-align:center">Streak<div class="v" style="left:0;right:0">3</div></div></div><div class="cta" style="bottom:90px;background:#23252a;color:#fff;box-shadow:none">↗ Share image</div><div class="cta">Done</div>`],
["A10 · Ask AI — paste & preview",`<div class="row"><b>✦ Ask AI for a meal plan</b><span class="b">✕</span></div><div class="li"><span class="mi">⧉</span><span style="flex:1"><b>Copy request</b><br><small class="sm">Paste it into ChatGPT / Claude</small></span></div><div class="sm" style="margin-top:14px">Paste the AI reply</div><div class="fld" style="height:90px;color:#8b8f97">\`\`\`json { "type": "weightgram.mealplan" … }</div><div class="card"><b>2,100 kcal · P150 C220 F60</b><div class="sm" style="margin-top:6px">07:30 Oats · 500 kcal<br>12:30 Rice & chicken · 700 kcal</div><div class="sm" style="margin-top:8px;color:var(--a)">Saved as a new plan — old plan stays</div></div><div class="cta">✓ Use this meal plan</div>`],
["A11 · Login error",`<div style="margin-top:120px;text-align:center"><div class="h1">Welcome <i>back</i></div><p class="sm" style="margin:8px 0 24px">Sign in to sync your training</p></div><div class="ch" style="justify-content:center;font-weight:700">G &nbsp;Continue with Google</div><div class="card" style="border:1px solid #ef4444;background:rgba(239,68,68,.1);margin-top:16px"><b style="color:#fca5a5">Can't connect</b><div class="sm">Check your internet and try again.</div></div>`],
["A12 · Empty state",`<div class="sm">Sunday 22 November</div><div class="h1">What do I <i>train today?</i></div><div style="text-align:center;margin-top:70px"><div class="ic" style="margin:0 auto 12px;background:rgba(255,138,61,.15);color:var(--a)">🏋️</div><b style="font-size:18px">Nothing planned yet</b><p class="sm" style="margin:6px 0 18px">Add a program or let AI build one</p></div><div class="cta" style="bottom:170px;background:#23252a;color:#fff;box-shadow:none">+ Add to today</div><div class="cta" style="bottom:104px">✦ Ask AI for programs</div>`+'<div class="tab"><div>⌂<span>Today</span></div><div>🍴<span>Eat</span></div><div class="fab">▶</div><div>📈<span>Stats</span></div><div>⋯<span>More</span></div></div>']];
document.body.innerHTML=S.map(([l,h])=>`<div class="w"><div class="lab">${l}</div><div class="ph">${h}</div></div>`).join("");
</script></body></html>
