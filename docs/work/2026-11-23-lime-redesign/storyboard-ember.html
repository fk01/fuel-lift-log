<!doctype html><html><head><meta charset="utf-8"><style>
:root{--a:#ff8a3d;--a2:#f97316;--g:#3a1d0c;--g2:#5a2c10;--g3:#3a2416;--bg:#0a0b0d;--c:#16181c}
*{box-sizing:border-box;margin:0}body{background:#e9ebea;font-family:"IBM Plex Sans",Arial,sans-serif;display:grid;grid-template-columns:repeat(5,360px);gap:56px 26px;padding:46px 28px 28px;color:#fff}
.w{position:relative}.lab{position:absolute;top:-30px;left:4px;color:#222;font-weight:700;font-size:15px}
.ph{width:360px;height:760px;border-radius:44px;border:9px solid #111;overflow:hidden;padding:44px 16px 0;background:radial-gradient(120% 42% at 50% 0%,var(--g),var(--bg) 62%);position:relative}
.h1{font-size:27px;font-weight:600;line-height:1.15}.h1 i{color:var(--a);font-family:Georgia,serif;font-weight:400}
.sm{color:#c9ccd2;font-size:13px}.row{display:flex;justify-content:space-between;align-items:center}
.b{width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.08);display:grid;place-items:center;font-size:16px}
.av{width:40px;height:40px;border-radius:50%;background:linear-gradient(135deg,var(--a),var(--a2));display:grid;place-items:center;color:#1a0d04;font-weight:800}
.days{display:flex;gap:5px;margin-top:12px}.d{flex:1;height:60px;border-radius:20px;background:rgba(255,255,255,.05);display:grid;place-items:center;font-size:11px;color:#aab;position:relative}.d b{color:#fff;font-size:14px}.d.on{outline:2px solid var(--a)}.d.ok::before{content:"";position:absolute;top:-5px;width:8px;height:8px;border-radius:50%;background:var(--a)}
.ch{margin:12px 0;height:62px;border-radius:32px;background:linear-gradient(90deg,var(--a),var(--a2));display:flex;align-items:center;gap:10px;padding:0 8px;color:#1a0d04}.ch .i{width:46px;height:46px;border-radius:50%;background:#1a0d04;display:grid;place-items:center}.ch b{font-size:15px}.bar{height:4px;background:rgba(0,0,0,.2);border-radius:2px;margin-top:5px}.bar i{display:block;height:100%;width:70%;background:#1a0d04;border-radius:2px}.go{margin-left:auto;width:46px;height:46px;border-radius:50%;background:#fff;display:grid;place-items:center}
.card{background:var(--c);border-radius:22px;padding:14px;margin-top:10px}
.pc{height:200px;border-radius:24px;background:#222 center/cover;position:relative;overflow:hidden;margin-top:10px}.pc::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 35%,rgba(0,0,0,.88))}.pc .t{position:absolute;left:14px;bottom:12px;z-index:2}.pc .t b{font-size:18px;display:block}
.pill{position:absolute;left:12px;top:12px;z-index:2;background:rgba(0,0,0,.55);border-radius:16px;padding:5px 10px;font-size:12px}.hrt{position:absolute;right:12px;top:12px;z-index:2;width:34px;height:34px;border-radius:50%;background:#fff;color:#1a0d04;display:grid;place-items:center}
.st{position:absolute;right:12px;bottom:12px;z-index:2;background:linear-gradient(90deg,var(--a),var(--a2));color:#1a0d04;font-weight:700;border-radius:20px;padding:8px 16px;font-size:14px}
.chips{display:flex;gap:6px;margin:12px 0 0}.chip{padding:9px 14px;border-radius:24px;background:var(--c);font-size:13px;white-space:nowrap}.chip.on{border:1.5px solid var(--a);background:none}
.tab{position:absolute;left:0;right:0;bottom:0;height:84px;background:#0f1012;display:flex;justify-content:space-around;align-items:center;font-size:11px;color:#8b8f97}.tab div{display:grid;justify-items:center;gap:3px}.tab .on{color:var(--a)}.fab{width:62px;height:62px;border-radius:50%;background:var(--a);margin-top:-40px;display:grid;place-items:center;color:#1a0d04;font-size:24px;box-shadow:0 0 0 7px #0f1012,0 0 22px rgba(255,138,61,.5)}
.mac{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center;font-size:11px;color:#aab;margin-top:10px}.mac b{display:block;color:#fff;font-size:17px}.mac em{display:block;height:4px;border-radius:2px;background:#2a2c31;margin-top:5px}.mac em i{display:block;height:100%;border-radius:2px}
.cta{position:absolute;left:16px;right:16px;bottom:24px;height:54px;border-radius:28px;background:linear-gradient(90deg,var(--a),var(--a2));color:#1a0d04;font-weight:700;display:grid;place-items:center;font-size:16px;box-shadow:0 0 22px rgba(255,138,61,.4)}
.hero{margin:-44px -16px 0;height:330px;background:#fff center 60%/contain no-repeat;position:relative}.hero .nv{position:absolute;top:48px;left:14px;right:14px;display:flex;justify-content:space-between}.hero .nv span{height:38px;min-width:38px;padding:0 10px;border-radius:20px;background:rgba(0,0,0,.6);display:grid;place-items:center;font-size:13px}
.ex{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid #23252a;font-size:14px}.no{width:26px;height:26px;border-radius:50%;background:#23252a;display:grid;place-items:center;font-size:12px}.ex .n{flex:1}.ex small{color:#8b8f97}.how{color:var(--a);font-size:13px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}.tl{border-radius:18px;background:linear-gradient(180deg,#16181c,var(--g3));padding:11px;height:128px;position:relative;font-size:12px}.tl.s{height:84px}.tl .v{position:absolute;left:11px;bottom:10px;font-size:21px}.tl .v small{font-size:11px;color:#c8ccd3}.tl svg{position:absolute;left:8px;top:38px;width:calc(100% - 16px)}
.li{display:flex;align-items:center;gap:12px;padding:14px;background:var(--c);border-radius:16px;margin-top:8px;font-size:14px}.li .mi{width:34px;height:34px;border-radius:10px;background:rgba(255,138,61,.15);color:var(--a);display:grid;place-items:center}
</style></head><body>
<script>
const T=(on)=>`<div class="tab"><div class="${on==0?"on":""}">⌂<span>Today</span></div><div class="${on==1?"on":""}">🍴<span>Eat</span></div><div class="fab">▶</div><div class="${on==3?"on":""}">📈<span>Stats</span></div><div class="${on==4?"on":""}">⋯<span>More</span></div></div>`;
const DAYS=`<div class="days">${[["S",16],["M",17],["T",18],["W",19,1],["T",20],["F",21,1],["S",22,1,1]].map(([a,b,o,s])=>`<div class="d${o?" ok":""}${s?" on":""}">${a}<b>${b}</b></div>`).join("")}</div>`;
const S=[
["0 · Login",`<div style="margin:-44px -16px 0;height:760px;background:url(rest-bg.jpg) center/cover;position:relative"><div style="position:absolute;inset:0;background:linear-gradient(180deg,rgba(10,11,13,.2),rgba(10,11,13,.95) 70%)"></div><div style="position:absolute;left:22px;right:22px;bottom:60px"><div class="h1" style="font-size:38px">Start Your<br>Fitness <i>Journey<br>Today</i></div><p class="sm" style="margin:12px 0 22px">Track workouts, meals and body — one app.</p><div class="ch" style="justify-content:center;font-weight:700">G &nbsp;Continue with Google</div></div></div>`],
["1 · Today",`<div class="row"><div><div class="sm">Hello FK01 👋</div><div class="h1">Build <i>Better Habits</i></div></div><div style="display:flex;gap:6px"><span class="b">🔥</span><span class="av">F</span></div></div>${DAYS}
<div class="ch"><span class="i">🏆</span><div style="flex:1"><b>Ongoing challenge</b><div style="font-size:10px;display:flex;justify-content:space-between"><span>Train 4×/week</span><span>3/4</span></div><div class="bar"><i></i></div></div><span class="go">↗</span></div>
<div class="pc" style="background-image:url(rest-bg.jpg)"><span class="pill">⏱ 42 min</span><span class="hrt">♥</span><div class="t"><b>Push A</b><span class="sm">Chest · Shoulders · 7 exercises</span></div><span class="st">Start</span></div>
<div class="card"><div class="row"><b>What do I eat today?</b><span style="color:var(--a)">›</span></div><div class="mac"><div>PROTEIN<b>76</b><em><i style="width:47%;background:var(--a)"></i></em></div><div>CARBS<b>128</b><em><i style="width:59%;background:#facc15"></i></em></div><div>FAT<b>20</b><em><i style="width:44%;background:#fb7185"></i></em></div></div></div>${T(0)}`],
["2 · Eat",`<div class="sm">Sunday 22 November</div><div class="h1">What do I <i>eat today?</i></div>${DAYS}
<div class="card" style="text-align:center"><div style="font-size:26px">🔥</div><div class="sm">CALORIES TODAY</div><b style="font-size:32px">1,004</b><span class="sm"> / 2,032 kcal</span><div class="bar" style="background:#2a2c31;height:6px;margin-top:8px"><i style="width:50%;background:linear-gradient(90deg,var(--a),var(--a2))"></i></div><div class="mac"><div>PROTEIN<b>76</b></div><div>CARBS<b>128</b></div><div>FAT<b>20</b></div></div></div>
<div class="chips"><span class="chip on">All</span><span class="chip">Breakfast</span><span class="chip">Lunch</span><span class="chip">Dinner</span></div>
<div class="li"><span class="mi">✓</span><span style="flex:1"><b>08:00 Breakfast</b><br><small class="sm">560 kcal · P45 C78 F7</small></span></div>
<div class="li" style="outline:1.5px solid var(--a)"><span class="mi">○</span><span style="flex:1"><b>12:30 Lunch</b><br><small class="sm">444 kcal · P31 C50 F13</small></span><span style="color:var(--a);font-size:12px">Next</span></div>${T(1)}`],
["3 · Train",`<div class="sm">Sunday 22 November</div><div class="h1">What do I <i>train today?</i></div>
<div class="chips"><span class="chip on">All</span><span class="chip">Gym</span><span class="chip">Condo</span><span class="chip">Cardio</span></div>
<div class="pc" style="background-image:url(rest-bg.jpg)"><span class="pill">⏱ 42 min · Gym</span><span class="hrt">♥</span><div class="t"><b>Pull B</b><span class="sm">Back · Biceps · 7 exercises</span></div><span class="st">Start</span></div>
<div class="li"><span class="mi">🏃</span><span style="flex:1"><b>วิ่งสวนรถไฟ</b><br><small class="sm">Cardio · Night</small></span><span class="st" style="position:static;padding:6px 12px">Log</span></div>
<div class="row" style="margin:14px 2px 0"><b>My programs</b><span style="color:var(--a);font-size:13px">See all ›</span></div>
<div style="display:flex;gap:8px"><div class="pc" style="flex:none;width:150px;height:130px;background-image:url(mus-base.png);background-size:contain;background-repeat:no-repeat;background-color:#2a1a10"><div class="t"><b style="font-size:15px">Push A</b><span class="sm">Gym · Tu</span></div></div><div class="pc" style="flex:none;width:150px;height:130px;background:#2a1a10"><div class="t"><b style="font-size:15px">Lower & Core</b><span class="sm">Condo</span></div></div></div>${T(-1)}`],
["4 · Program details",`<div class="hero" style="background-image:url(lat.gif)"><div class="nv"><span>‹</span><span>♡</span></div></div>
<div class="sm" style="margin-top:10px">⏱ 42 min │ 💪 Back, Biceps │ 7 exercises</div><div class="h1" style="font-size:22px;margin:6px 0 6px">Pull B — Back & Deadlift</div>
<div class="ex"><span class="no">1</span><span class="n">Lat Pulldown<br><small>4 × 8-10</small></span><span class="how">How to ›</span></div>
<div class="ex"><span class="no">2</span><span class="n">Seated Cable Row<br><small>3 × 8-10</small></span><span class="how">How to ›</span></div>
<div class="ex"><span class="no">3</span><span class="n">Deadlift<br><small>3 × 5-8</small></span><span class="how">How to ›</span></div>
<div class="cta">▶ Start workout</div>`],
["5 · Workout",`<div class="hero" style="height:300px;background-image:url(lat.gif)"><div class="nv"><span>‹</span><span>08:39 · 1/7</span></div></div>
<div style="height:3px;background:#2a2c31;margin-top:-2px"><i style="display:block;width:35%;height:100%;background:var(--a)"></i></div>
<div class="row sm" style="margin:10px 0"><span>⏮ &nbsp; ❚❚ &nbsp; ⏭</span><span>Set 2 / 4 · 45 kg</span></div><div class="h1" style="font-size:22px">Lat Pulldown</div>
<div class="card" style="display:grid;gap:8px">${[1,2,3].map(n=>`<div class="row"><span>${n}</span><b>45 kg</b><span>× 8</span><span style="width:30px;height:30px;border-radius:9px;${n==1?"background:var(--a);color:#1a0d04":"border:1.5px solid #34363b"};display:grid;place-items:center">${n==1?"✓":""}</span></div>`).join("")}</div>
<div class="cta">✓ Finish & save · 1/22</div>`],
["6 · Rest",`<div class="row"><b>Rest</b><span class="sm"><b style="color:var(--a)">Lat Pulldown</b> Set 2/4</span></div>
<div style="margin-top:12px;border-radius:20px;background:#fff url(lat.gif) center/contain no-repeat;height:260px;border:2px solid var(--a);box-shadow:0 0 22px rgba(255,138,61,.35);position:relative"><span style="position:absolute;right:10px;top:10px;width:32px;height:32px;border-radius:50%;background:rgba(15,16,18,.75);display:grid;place-items:center">❚❚</span></div>
<div style="width:200px;height:200px;margin:26px auto;border-radius:50%;border:8px solid var(--a);box-shadow:0 0 24px rgba(255,138,61,.5);display:grid;place-items:center;font-size:52px;color:var(--a)">1:13</div>
<div style="display:grid;grid-template-columns:1fr 1fr 2fr;gap:8px"><span class="card" style="margin:0;text-align:center">−15s</span><span class="card" style="margin:0;text-align:center">+15s</span><span class="ch" style="margin:0;height:auto;justify-content:center;font-weight:700">Ready</span></div>`],
["7 · Stats",`<div class="row"><span class="b">‹</span><b>My Progress</b><span class="b">⋮</span></div>${DAYS}
<div class="card row" style="background:linear-gradient(90deg,#15171b,var(--g2))"><span><span class="sm">Target weight</span><br><b style="font-size:17px">75 kg</b></span><span class="st" style="position:static">Update</span></div>
<div class="grid"><div class="tl">💪 Volume<svg viewBox="0 0 140 40"><path d="M0 28 L25 28 C35 28 35 6 45 6 C55 6 55 34 65 34 C75 34 75 14 85 14 L140 14" fill="none" stroke="#ff8a3d" stroke-width="3"/></svg><div class="v">1,684<small> kg</small></div></div>
<div class="tl">🔥 Calories<svg viewBox="0 0 140 40"><path d="M0 26 C20 26 20 8 40 8 C60 8 60 28 80 28 C100 28 110 6 140 6 L140 40 L0 40Z" fill="#ff8a3d" opacity=".25"/><path d="M0 26 C20 26 20 8 40 8 C60 8 60 28 80 28 C100 28 110 6 140 6" fill="none" stroke="#ff8a3d" stroke-width="3"/></svg><div class="v">1,806<small> kcal</small></div></div>
<div class="tl s">🥩 Protein<div class="v">162<small> g</small></div></div><div class="tl s">📅 Trained<div class="v">3<small> days/wk</small></div></div></div>
<div class="card"><span class="sm">Body weight</span><b style="display:block;color:var(--a);font-size:20px">80.6 kg</b><svg viewBox="0 0 300 50" style="width:100%"><path d="M0 42 C40 42 50 8 90 8 C130 8 130 38 170 38 C210 38 230 24 300 22" fill="none" stroke="#ff8a3d" stroke-width="3"/></svg></div>${T(3)}`],
["8 · More",`<div class="row"><div class="row" style="gap:12px"><span class="av" style="width:56px;height:56px;font-size:22px">F</span><span><b style="font-size:18px">FK01</b><br><span class="sm">Google account</span></span></div></div>
${[["👤","Profile","80 kg · Build muscle"],["📍","Places & equipment","Gym · Condo"],["⏱","Recovery times","19 muscles"],["🏅","Badges","3 unlocked"],["🌐","Language","ไทย / English"],["↩","Sign out",""]].map(([i,a,b])=>`<div class="li"><span class="mi">${i}</span><span style="flex:1"><b>${a}</b><br><small class="sm">${b}</small></span><span class="sm">›</span></div>`).join("")}${T(4)}`]];
document.body.innerHTML=S.map(([l,h])=>`<div class="w"><div class="lab">${l}</div><div class="ph">${h}</div></div>`).join("");
</script></body></html>
